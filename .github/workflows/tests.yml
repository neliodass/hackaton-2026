name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            server/requirements.txt
            client/requirements.txt
            merkle_service/requirements.txt

      - name: Install dependencies
        run: |
          pip install pytest
          pip install -r server/requirements.txt
          pip install -r client/requirements.txt
          pip install -r merkle_service/requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/client/src
        run: pytest
